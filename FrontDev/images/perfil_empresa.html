<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil da Empresa</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid min-vh-100">
    <div class="row min-vh-100">

        <!-- LADO ESQUERDO -->
        <div class="col-lg-5 d-flex align-items-center justify-content-center text-center text-dark"
             style="background-color:#C4A747;">

            <div class="p-4">

                <h1 class="fw-bold mb-3">
                    PERFIL DA EMPRESA
                </h1>

                <p class="mb-4">
                    Complete as informações da empresa para fortalecer sua presença na plataforma.
                </p>

                <div class="d-grid gap-3">

                    <!-- VOLTAR -->
                    <a class="btn btn-light btn-lg fw-semibold"
                       href="{{ url_for('feed') }}">

                        Voltar para feed

                    </a>

                    <!-- SAIR -->
                    <a class="btn btn-outline-dark btn-lg fw-semibold"
                       href="{{ url_for('logout') }}">

                        Sair

                    </a>

                </div>

            </div>

        </div>

        <!-- LADO DIREITO -->
        <div class="col-lg-7 d-flex align-items-center justify-content-center bg-white py-4">

            <div class="w-100 shadow p-4 rounded"
                 style="max-width:650px;">

                <!-- LOGO -->
                <div class="text-center mb-4">

                    <img src="{{ url_for('static', filename='images/7d44d014-69c1-463d-894a-80f197826c7d.png') }}"
                         alt="Logo"
                         style="max-height:80px;">

                </div>

                <h2 class="text-center mb-4">
                    Cadastro da Empresa
                </h2>

                <!-- ALERTAS -->
            
                            <div class="alert alert-{{ category }}" role="alert">
                                {{ message }}
                            </div>

                <!-- FORMULÁRIO -->
                <form method="POST">

                    <!-- NOME DA EMPRESA -->
                    <div class="mb-3">

                        <label class="form-label">
                            Nome da Empresa
                        </label>

                        <input type="text"
                               class="form-control"
                               name="nome_empresa"
                               value="{{ empresa.nome_empresa }}"
                               placeholder="Digite o nome da empresa"
                               required>

                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">

                        <label class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               class="form-control"
                               name="email"
                               value="{{ empresa.email }}"
                               placeholder="empresa@email.com"
                               required>

                    </div>

                    <!-- TELEFONE -->
                    <div class="mb-3">

                        <label class="form-label">
                            Telefone
                        </label>

                        <input type="text"
                               class="form-control"
                               name="telefone"
                               value="{{ empresa.telefone }}"
                               placeholder="(00) 00000-0000"
                               maxlength="15"
                               required>

                    </div>

                    <!-- CNPJ -->
                    <div class="mb-4">

                        <label class="form-label">
                            CNPJ
                        </label>

                        <input type="text"
                               class="form-control"
                               name="cnpj"
                               value="{{ empresa.numero_registro }}"
                               placeholder="00.000.000/0000-00"
                               maxlength="18"
                               required>

                    </div>

                    <!-- BOTÃO -->
                    <div class="d-grid">

                        <button type="submit"
                                class="btn btn-lg fw-semibold text-dark"
                                style="background-color:#C4A747;">

                            Salvar Informações

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

</body>
</html>
