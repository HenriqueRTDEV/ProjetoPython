<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container-fluid min-vh-100">
        <div class="row min-vh-100">

            <!-- LADO ESQUERDO -->
            <div class="col-lg-5 d-flex align-items-center justify-content-center text-center text-dark"
                style="background-color:#C4A747;">

                <div class="p-4">

                    <!-- LOGO -->
                    <div class="text-center mb-4">
                        <img src="Revisados/Enabel Logo.png"
                            alt="Logo"
                            class="img-fluid"
                            style="max-height:120px;">
                    </div>

                    <h1 class="fw-bold mb-3">CADASTRAR</h1>

                    <p class="mb-4">
                        Se você ainda não possui login, selecione uma das opções abaixo.
                    </p>

                    <div class="d-grid gap-3">

                        <a class="btn btn-light btn-lg fw-semibold"
                            href="{{ url_for('cadastro_usuario') }}">
                            Usuário
                        </a>

                        <a class="btn btn-light btn-lg fw-semibold"
                            href="{{ url_for('cadastro_empresa') }}">
                            Empresa
                        </a>

                    </div>

                </div>
            </div>

            <!-- LADO DIREITO -->
            <div class="col-lg-7 d-flex align-items-center justify-content-center">

                <div class="card shadow-lg border-0 w-100" style="max-width:500px;">

                    <div class="card-body p-4 p-md-5">

                        <!-- LOGO -->
                        <div class="text-center mb-4">

                            <img src="{{ url_for('static', filename='images/canva-logo.png') }}"
                                alt="Logo"
                                style="max-height:80px;"
                                onerror="this.style.display='none'">

                        </div>

                        <h2 class="text-center mb-4">LOGIN</h2>

                        <!-- FORMULÁRIO -->
                        <form method="POST" action="{{ url_for('login') }}">

                            <!-- EMAIL -->
                            <div class="mb-3">

                                <label class="form-label">Email</label>

                                <input type="email"
                                    class="form-control"
                                    name="email"
                                    required>

                            </div>

                            <!-- SENHA -->
                            <div class="mb-3">

                                <label class="form-label">Senha</label>

                                <input type="password"
                                    class="form-control"
                                    name="password"
                                    required>

                            </div>

                            <!-- RECUPERAR SENHA -->
                            <div class="text-end mb-4">

                                <a href="{{ url_for('recuperar_senha') }}"
                                    class="text-decoration-none"
                                    style="font-size:14px;">

                                    Esqueci minha senha

                                </a>

                            </div>

                            <!-- BOTÃO -->
                            <div class="d-grid">

                                <button type="submit"
                                    class="btn btn-lg fw-semibold text-dark"
                                    style="background-color:#C4A747;">

                                    Entrar

                                </button>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
