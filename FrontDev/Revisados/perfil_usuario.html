<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid min-vh-100">
    <div class="row min-vh-100">

        <!-- LADO ESQUERDO -->
        <div class="col-lg-5 d-flex align-items-center justify-content-center text-center text-dark"
             style="background-color:#C4A747;">

            <div class="p-4">

                <h1 class="fw-bold mb-3">MEU PERFIL</h1>

                <p class="mb-4">
                    Complete suas informações para deixar o seu perfil mais profissional.
                </p>

                <div class="d-grid gap-3">
                    <a class="btn btn-light btn-lg fw-semibold" href="#">
                        Voltar para feed
                    </a>

                    <a class="btn btn-outline-dark btn-lg fw-semibold" href="#">
                        Sair
                    </a>
                </div>

            </div>
        </div>

        <!-- LADO DIREITO -->
        <div class="col-lg-7 d-flex align-items-center justify-content-center bg-white py-4">

            <div class="w-100 shadow p-4 rounded" style="max-width:650px;">

                <!-- LOGO -->
                <div class="text-center mb-4">
                <img src="images/7d44d014-69c1-463d-894a-80f197826c7d.png"
                         alt="Logo"
                         style="max-height:80px;">
                </div>

                <h2 class="text-center mb-4">Tela de Perfil</h2>

                <!-- ALERTA EXEMPLO -->
                <div class="alert alert-success" role="alert">
                    Perfil atualizado com sucesso!
                </div>

                <!-- FORMULÁRIO -->
                <form>

                    <!-- DADOS FIXOS -->
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nome</label>

                            <input type="text"
                                   class="form-control bg-light"
                                   value="João da Silva"
                                   readonly>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">CPF</label>

                            <input type="text"
                                   class="form-control bg-light"
                                   value="000.000.000-00"
                                   readonly>
                        </div>

                    </div>

                    <!-- DADOS EDITÁVEIS -->
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefone</label>

                            <input type="text"
                                   class="form-control"
                                   name="telefone"
                                   placeholder="(00) 00000-0000"
                                   maxlength="15"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Idade</label>

                            <input type="number"
                                   class="form-control"
                                   name="idade"
                                   min="14"
                                   max="120"
                                   required>
                        </div>

                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">

                        <label class="form-label">Email</label>

                        <input type="email"
                               class="form-control bg-light"
                               value="usuario@email.com"
                               readonly>

                    </div>

                    <!-- EXPERIÊNCIA -->
                    <div class="mb-3">

                        <label class="form-label">
                            Experiência Profissional
                        </label>

                        <textarea class="form-control"
                                  name="experiencia"
                                  rows="3"
                                  placeholder="Descreva suas experiências"></textarea>

                    </div>

                    <!-- FORMAÇÃO -->
                    <div class="mb-3">

                        <label class="form-label">
                            Formação Acadêmica
                        </label>

                        <textarea class="form-control"
                                  name="formacao"
                                  rows="3"
                                  placeholder="Ex: Ensino Médio, Graduação..."></textarea>

                    </div>

                    <!-- COMPETÊNCIAS -->
                    <div class="mb-3">

                        <label class="form-label">
                            Competências
                        </label>

                        <textarea class="form-control"
                                  name="competencias"
                                  rows="3"
                                  placeholder="Ex: Comunicação, Design, Marketing..."></textarea>

                    </div>

                    <!-- BOTÃO -->
                    <div class="d-grid mt-3">

                        <button type="submit"
                                class="btn btn-lg fw-semibold text-dark"
                                style="background-color:#C4A747;">

                            Salvar perfil

                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
</body>
</html>
