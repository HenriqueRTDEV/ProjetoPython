<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Vaga</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid min-vh-100">
    <div class="row min-vh-100">

        <!-- Lado esquerdo -->
        <div class="col-lg-5 d-flex align-items-center justify-content-center text-center text-dark"
             style="background-color:#C4A747;">

            <div class="p-4">
                <h1 class="fw-bold mb-3">NOVA VAGA</h1>

                <p class="mb-4">
                    Cadastre uma nova oportunidade para encontrar profissionais para sua empresa.
                </p>

                <div class="d-grid gap-3">

                    <a class="btn btn-light btn-lg fw-semibold" href="#">
                        Voltar para dashboard
                    </a>

                    <a class="btn btn-outline-dark btn-lg fw-semibold" href="#">
                        Sair
                    </a>

                </div>
            </div>
        </div>

        <!-- Formulário -->
        <div class="col-lg-7 d-flex align-items-center justify-content-center bg-white py-4">

            <div class="w-100 shadow p-4 rounded" style="max-width:650px;">

                <div class="text-center mb-4">
                    <img src="images/canva-logo.png"
                         alt="Logo"
                         style="max-height:80px;">
                </div>

                <h2 class="text-center mb-4">
                    Cadastrar Nova Vaga
                </h2>

                <form>

                    <div class="mb-3">
                        <label class="form-label">
                            Título da vaga
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Digite o título da vaga"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Descrição
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  placeholder="Descreva a vaga"
                                  required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Requisitos
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  placeholder="Informe os requisitos"
                                  required></textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Salário
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Ex: R$ 2.500,00">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Localização
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Ex: Porto Alegre - RS"
                                   required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Tipo de contrato
                            </label>

                            <select class="form-select" required>
                                <option selected disabled>
                                    Selecione
                                </option>

                                <option>
                                    CLT
                                </option>

                                <option>
                                    PJ
                                </option>

                                <option>
                                    Estágio
                                </option>

                                <option>
                                    Freelancer
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Modalidade
                            </label>

                            <select class="form-select" required>
                                <option selected disabled>
                                    Selecione
                                </option>

                                <option>
                                    Presencial
                                </option>

                                <option>
                                    Híbrido
                                </option>

                                <option>
                                    Remoto
                                </option>
                            </select>
                        </div>

                    </div>

                    <div class="d-grid mt-3">

                        <button type="submit"
                                class="btn btn-lg fw-semibold text-dark"
                                style="background-color:#C4A747;">

                            Publicar vaga

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

</body>
</html>
