<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Vaga</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid min-vh-100">
    <div class="row min-vh-100">

        <!-- LADO ESQUERDO -->
        <div class="col-lg-5 d-flex align-items-center justify-content-center text-center text-dark"
             style="background-color:#C4A747;">

            <div class="p-4">

                <h1 class="fw-bold mb-3">
                    EDITAR VAGA
                </h1>

                <p class="mb-4">
                    Atualize as informações da sua publicação.
                </p>

                <div class="d-grid gap-3">

                    <a class="btn btn-light btn-lg fw-semibold" href="#">
                        Voltar para vagas
                    </a>

                    <a class="btn btn-outline-dark btn-lg fw-semibold" href="#">
                        Sair
                    </a>

                </div>

            </div>
        </div>

        <!-- LADO DIREITO -->
        <div class="col-lg-7 d-flex align-items-center justify-content-center bg-white py-4">

            <div class="w-100 shadow p-4 rounded" style="max-width:700px;">

                <h2 class="text-center mb-4">
                    Editar vaga
                </h2>

                <!-- ALERTA -->
                <div class="alert alert-success" role="alert">
                    Atualize os dados da vaga abaixo.
                </div>

                <!-- FORMULÁRIO -->
                <form>

                    <!-- TÍTULO -->
                    <div class="mb-3">

                        <label class="form-label">
                            Título da vaga
                        </label>

                        <input type="text"
                               class="form-control"
                               value="Desenvolvedor Front-End"
                               required>

                    </div>

                    <!-- DESCRIÇÃO -->
                    <div class="mb-3">

                        <label class="form-label">
                            Descrição
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  required>Descrição da vaga...</textarea>

                    </div>

                    <!-- REQUISITOS -->
                    <div class="mb-3">

                        <label class="form-label">
                            Requisitos
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  required>Requisitos da vaga...</textarea>

                    </div>

                    <!-- SALÁRIO E LOCALIZAÇÃO -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Salário
                            </label>

                            <input type="text"
                                   class="form-control"
                                   value="R$ 3.500,00">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Localização
                            </label>

                            <input type="text"
                                   class="form-control"
                                   value="São Paulo - SP"
                                   required>

                        </div>

                    </div>

                    <!-- CONTRATO E MODALIDADE -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Tipo de contrato
                            </label>

                            <select class="form-select" required>

                                <option selected>
                                    CLT
                                </option>

                                <option>
                                    PJ
                                </option>

                                <option>
                                    Estágio
                                </option>

                                <option>
                                    Freelancer
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Modalidade
                            </label>

                            <select class="form-select" required>

                                <option selected>
                                    Presencial
                                </option>

                                <option>
                                    Híbrido
                                </option>

                                <option>
                                    Remoto
                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- BOTÃO -->
                    <div class="d-grid mt-3">

                        <button type="submit"
                                class="btn btn-lg fw-semibold text-dark"
                                style="background-color:#C4A747;">

                            Salvar alterações

                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
